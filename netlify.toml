# ============================================================
# DailyVet — Netlify Configuration
# ============================================================

[build]
  publish = "."
  functions = "netlify/functions"

# ============================================================
# API Proxy — browser থেকে সরাসরি key কখনো দেখাবে না
# ============================================================
[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true

[[redirects]]
  from = "/api/groq"
  to = "/.netlify/functions/groq"
  status = 200
  force = true

[[redirects]]
  from = "/api/openrouter"
  to = "/.netlify/functions/openrouter"
  status = 200
  force = true

# ============================================================
# Headers — security
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self)"

# ============================================================
# Cache static assets (performance)
# ============================================================
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ============================================================
# PWA files — no cache
# ============================================================
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"