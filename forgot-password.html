<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>DailyVet | Reset Password with Phone</title>
    <meta name="description" content="Reset your DailyVet account password using your verified mobile phone number." />
    <meta name="theme-color" content="#035D69" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link rel="preconnect" href="https://flagcdn.com" crossorigin />

    <!-- Tailwind CSS v4 -->
    <script src="js/tailwind-v4.js"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-heading: 'Plus Jakarta Sans', sans-serif;
            --font-sans: 'Inter', sans-serif;
            --color-deep: #035D69;
            --color-dark: #023d47;
            --color-teal: #088F8F;
            --color-line: #b2e0e6;
            --color-soft: #eef7f8;
            --color-edge: #e0f0f2;
            --color-mute: #8ab8be;
            --color-danger: #e74c3c;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Firebase SDKs -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-gradient-to-br from-[#f0f8f9] via-white to-[#e4f3f5] text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 lg:p-8 selection:bg-teal selection:text-white">

    <!-- Top Return Link -->
    <div class="w-full max-w-md mb-4 flex items-center justify-between text-xs">
        <a href="login.html" class="inline-flex items-center gap-1.5 text-deep font-bold hover:text-teal transition-colors no-underline">
            <i class="fas fa-arrow-left text-[11px]"></i>
            <span>Back to Sign In</span>
        </a>
        <span class="text-teal font-semibold">Phone Security Reset</span>
    </div>

    <!-- Container Card -->
    <div class="login-container w-full max-w-md bg-white/95 backdrop-blur-xl border border-edge rounded-3xl shadow-xl shadow-deep/10 p-6 sm:p-8 flex flex-col gap-6 text-center">

        <!-- Brand -->
        <div class="flex flex-col items-center gap-2">
            <div class="w-16 h-16 rounded-2xl bg-soft border border-line flex items-center justify-center p-2.5 shadow-2xs cursor-pointer" onclick="window.location.href='index.html'">
                <img src="assets/dailyvetlogo.png" alt="DailyVet" class="w-full h-full object-contain" />
            </div>
            <div class="flex flex-col items-center mt-1">
                <span class="text-2xl font-extrabold font-heading tracking-tight leading-none">
                    <span class="text-deep">Daily</span><span class="text-teal">Vet</span>
                </span>
                <span class="text-[10px] font-bold text-teal uppercase tracking-wider mt-0.5">Account Security</span>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold font-heading text-deep tracking-tight">Reset Password</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">Enter your registered mobile phone number to set a new password</p>
            </div>
        </div>

        <!-- Form -->
        <form class="flex flex-col gap-4 text-left" id="resetForm">

            <!-- Phone with country picker -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-deep uppercase tracking-wider">Mobile Number <span class="text-danger">*</span></label>
                <div class="phone-input-wrapper relative flex items-center gap-2 w-full h-13 bg-soft/70 border border-line rounded-2xl p-1.5 pr-3 focus-within:bg-white focus-within:border-deep focus-within:ring-3 focus-within:ring-teal/20 transition-all shadow-2xs">
                    <button type="button"
                            class="flex items-center gap-1.5 h-10 px-2.5 bg-white border border-line rounded-xl font-bold text-xs text-deep whitespace-nowrap shrink-0 cursor-pointer hover:bg-soft transition-all shadow-2xs"
                            id="countryBtn"
                            aria-expanded="false"
                            title="Select Country">
                        <img id="selectedFlag"
                             class="w-5 h-3.5 object-cover rounded-xs"
                             src="https://flagcdn.com/w40/bd.png"
                             alt="BD" />
                        <span class="font-bold text-xs text-deep" id="selectedCode">+880</span>
                        <i class="fas fa-chevron-down text-[9px] text-teal transition-transform duration-200 chevron"></i>
                    </button>

                    <input type="tel"
                           id="resetPhone"
                           class="phone-number-input flex-1 min-w-0 h-10 border-none outline-none bg-transparent font-sans text-sm text-deep placeholder:text-mute font-semibold"
                           placeholder="1XXXXXXXXX"
                           maxlength="15"
                           inputmode="numeric"
                           required />

                    <div class="country-list hidden [&.open]:block absolute top-[calc(100%+8px)] left-0 right-0 max-h-80 bg-white border border-line rounded-2xl shadow-xl overflow-hidden z-50 text-left" id="countryList">
                        <div class="flex items-center gap-2.5 p-3 bg-soft border-b border-edge">
                            <i class="fas fa-search text-teal text-xs"></i>
                            <input type="text"
                                   id="countrySearch"
                                   class="flex-1 min-w-0 border-none outline-none bg-transparent font-sans text-xs text-deep placeholder:text-mute font-medium"
                                   placeholder="Search country..." />
                        </div>
                        <div class="country-scroll max-h-64 overflow-y-auto" id="countryScroll"></div>
                    </div>
                </div>
            </div>

            <!-- New Password -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-deep uppercase tracking-wider">New Password <span class="text-danger">*</span></label>
                <div class="relative flex items-center w-full h-13 bg-soft/70 border border-line rounded-2xl px-4 focus-within:bg-white focus-within:border-deep focus-within:ring-3 focus-within:ring-teal/20 transition-all shadow-2xs">
                    <i class="fas fa-lock text-mute text-xs mr-2.5"></i>
                    <input type="password"
                           id="newPassword"
                           class="flex-1 min-w-0 h-full border-none outline-none bg-transparent font-sans text-sm text-deep placeholder:text-mute font-medium"
                           placeholder="Enter new password (min 6 chars)"
                           required />
                    <button type="button"
                            class="toggle-password border-none bg-transparent text-mute hover:text-teal cursor-pointer p-1.5 text-sm transition-colors"
                            data-target="newPassword"
                            aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-deep uppercase tracking-wider">Confirm New Password <span class="text-danger">*</span></label>
                <div class="relative flex items-center w-full h-13 bg-soft/70 border border-line rounded-2xl px-4 focus-within:bg-white focus-within:border-deep focus-within:ring-3 focus-within:ring-teal/20 transition-all shadow-2xs">
                    <i class="fas fa-shield-alt text-mute text-xs mr-2.5"></i>
                    <input type="password"
                           id="confirmPassword"
                           class="flex-1 min-w-0 h-full border-none outline-none bg-transparent font-sans text-sm text-deep placeholder:text-mute font-medium"
                           placeholder="Confirm new password"
                           required />
                    <button type="button"
                            class="toggle-password border-none bg-transparent text-mute hover:text-teal cursor-pointer p-1.5 text-sm transition-colors"
                            data-target="confirmPassword"
                            aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="w-full mt-2 py-3.5 px-6 bg-gradient-to-r from-deep via-dark to-teal hover:from-dark hover:to-deep text-white rounded-2xl font-bold text-sm tracking-wide shadow-md shadow-deep/20 hover:shadow-lg hover:-translate-y-0.5 active:scale-98 transition-all cursor-pointer flex items-center justify-center gap-2.5 border-0">
                <i class="fas fa-key text-teal-200"></i>
                <span>Update Password &amp; Sign In</span>
            </button>
        </form>

        <p class="text-center pt-2 border-t border-edge text-xs text-slate-500">
            Remembered your password?
            <a href="login.html" class="font-bold text-teal hover:underline ml-1">Sign in with Phone →</a>
        </p>
    </div>

    <!-- Scripts (order important) -->
    <script defer src="js/firebase-config.js"></script>
    <script defer src="js/script.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/scale.js"></script>
</body>
</html>
